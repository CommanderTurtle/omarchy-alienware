name: Test

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  model:
    name: Model tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm test

  helper:
    name: Helper tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: helper/go.mod
          cache-dependency-path: helper/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - name: Build the binary the release ships
        run: go build -o /tmp/alienwarectl ./cmd/alienwarectl
      - run: /tmp/alienwarectl version
      - run: go test -race ./...

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: shell syntax
        run: |
          bash -n packaging/PKGBUILD
          bash -n packaging/omarchy-alienware.install
          bash -n scripts/install-helper.sh
          bash -n scripts/check-controllers.sh
      - name: xml
        run: |
          python3 - <<'PY'
          import xml.dom.minidom
          for path in (
              "packaging/dbus/org.xyzlab.Alienware1.conf",
              "packaging/polkit/org.xyzlab.alienware.policy",
          ):
              xml.dom.minidom.parse(path)
              print("parsed", path)
          PY
      - name: manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"

  native:
    name: Native SDK bridge (no hardware)
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Build dependencies
        run: pacman -Syu --noconfirm --needed base-devel cmake ninja git python pkgconf nlohmann-json libusb hidapi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Compile pinned sources and exercise hardware-free contracts
        run: |
          cmake -S backend -B backend/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build backend/build
          ctest --test-dir backend/build --output-on-failure
          DESTDIR=/tmp/alienware-stage cmake --install backend/build
          test -s /tmp/alienware-stage/usr/share/omarchy-alienware/awcc/database.json
          test -x /tmp/alienware-stage/usr/lib/omarchy-alienware/alienware-backend

  versions:
    name: Versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: manifest, package, helper and PKGBUILD must match
        run: |
          manifest=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          pkg=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          helper=$(sed -n 's/^var Version = "\(.*\)"$/\1/p' helper/internal/cli/cli.go)
          makepkg=$(sed -n 's/^pkgver=//p' packaging/PKGBUILD)
          echo "manifest.json      $manifest"
          echo "package.json       $pkg"
          echo "cli.go             $helper"
          echo "packaging/PKGBUILD $makepkg"
          if [ "$manifest" != "$pkg" ] || [ "$manifest" != "$helper" ] || [ "$manifest" != "$makepkg" ]; then
            echo "these must all be the same version"
            exit 1
          fi
      - name: a release note exists for this version
        run: |
          manifest=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          test -f "release-notes/v${manifest}.md"
      - name: native version agrees
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          version = json.loads(pathlib.Path('manifest.json').read_text())['version']
          cmake = pathlib.Path('backend/CMakeLists.txt').read_text()
          main = pathlib.Path('backend/main.cpp').read_text()
          assert re.search(r'project\(alienware_backend VERSION ' + re.escape(version) + r' ', cmake)
          assert '{"backend", "' + version + '"}' in main
          PY

  style:
    name: House rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: no em dashes
        run: |
          dash=$(printf '\u2014')
          if grep -rn "$dash" . --exclude-dir=.git; then
            echo "em dash found, use a hyphen"
            exit 1
          fi
      - name: no code comments
        run: |
          if grep -rnE '^[[:space:]]*(//|/\*)' --include='*.qml' --include='*.js' --include='*.go' . ; then
            echo "code comments found"
            exit 1
          fi
