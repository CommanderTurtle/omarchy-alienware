name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/test.yml

  source:
    name: Publish complete source
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check release tag
        run: |
          version=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          test "$GITHUB_REF_NAME" = "v${version}"
          test -f "release-notes/${GITHUB_REF_NAME}.md"
      - name: Archive the complete committed source
        run: |
          name="omarchy-alienware-${GITHUB_REF_NAME}"
          git archive --format=tar --prefix="${name}/" HEAD | gzip -n > "${name}.tar.gz"
          sha256sum "${name}.tar.gz" > sha256sums.txt
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "release-notes/${GITHUB_REF_NAME}.md" \
            "omarchy-alienware-${GITHUB_REF_NAME}.tar.gz" sha256sums.txt
